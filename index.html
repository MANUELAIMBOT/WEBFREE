<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>EMPIRE TECH</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
:root{
  --bg:#030508;--card:rgba(4,8,22,.94);
  --gold:#f59e0b;--gold2:#fbbf24;--gd:rgba(245,158,11,.35);
  --blue:#0ea5e9;--blue2:#38bdf8;--bd:rgba(14,165,233,.32);
  --txt:#e2e8f0;--mut:#475569;--mut2:#94a3b8;
  --green:#22c55e;--red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--txt);min-height:100vh;font-family:'Rajdhani',sans-serif;overflow:hidden;position:relative;display:flex;flex-direction:column;}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;}

/* ══ HEADER ═════════════════════════════════════════════════ */
.hbar{position:relative;z-index:10;background:rgba(3,5,8,.97);border-bottom:1px solid rgba(245,158,11,.18);padding:11px 15px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 18px rgba(0,0,0,.8);flex-shrink:0;}
.btn-back{display:flex;align-items:center;gap:5px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:7px 11px;color:var(--gold);font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:background .2s;flex-shrink:0;}
.btn-back:active{background:rgba(245,158,11,.2);}
.hcenter{flex:1;text-align:center;}
.htitle{font-family:'Orbitron',sans-serif;font-size:.82rem;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--blue2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hsub{font-size:.6rem;color:var(--mut2);letter-spacing:.4px;margin-top:1px;}
.hbadge{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:7px;padding:4px 9px;font-size:.6rem;font-weight:700;color:var(--green);letter-spacing:.3px;flex-shrink:0;}

/* ══ SCREENS ════════════════════════════════════════════════ */
.screens{position:relative;z-index:1;flex:1;overflow:hidden;}
.screen{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .38s ease,transform .38s ease;transform:translateX(40px);overflow-y:auto;}
.screen.active{opacity:1;pointer-events:auto;transform:translateX(0);}
.screen.exit{opacity:0;transform:translateX(-40px);}

/* ══ CARD ════════════════════════════════════════════════════ */
.card{width:100%;max-width:390px;background:var(--card);backdrop-filter:blur(20px);border:1.5px solid var(--gold);border-radius:20px;padding:20px 17px 18px;box-shadow:0 0 28px var(--gd),0 16px 40px rgba(0,0,0,.85);position:relative;overflow:hidden;animation:bc 7s infinite alternate;}
@keyframes bc{0%{border-color:var(--gold);box-shadow:0 0 26px var(--gd);}100%{border-color:var(--blue);box-shadow:0 0 26px var(--bd);}}
.card::after{content:'';position:absolute;top:-100%;left:0;width:100%;height:30%;background:linear-gradient(180deg,transparent,rgba(245,158,11,.04),transparent);animation:scan 5s ease-in-out infinite;pointer-events:none;}
@keyframes scan{0%{top:-100%;}65%,100%{top:180%;}}

/* ══ SERVER ROW ═════════════════════════════════════════════ */
.srv-row{display:flex;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid rgba(245,158,11,.1);}
.srv-ico{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#92400e,var(--gold));display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;box-shadow:0 0 13px var(--gd);}
.srv-name{font-family:'Orbitron',sans-serif;font-size:.84rem;font-weight:900;color:var(--txt);}
.srv-s{font-size:.68rem;color:var(--mut2);margin-top:2px;}
.sdot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 6px var(--green);animation:pp 1.4s ease-in-out infinite;margin-left:auto;}
@keyframes pp{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.75);}}

/* ══ STOCK (datos reales en vivo desde Firebase) ═════════════ */
.stock-box{display:flex;align-items:center;justify-content:space-between;background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.16);border-radius:12px;padding:11px 14px;margin-bottom:14px;}
.sl{display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--mut2);font-weight:600;}
.ldot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 6px var(--green);animation:pp 1.4s ease-in-out infinite;}
.stock-r{text-align:right;}
.snum{font-family:'Orbitron',sans-serif;font-size:1.35rem;font-weight:900;color:var(--gold);text-shadow:0 0 10px var(--gd);line-height:1;transition:color .3s;}
.snum.update{color:var(--green);}
.su{font-size:.58rem;color:var(--mut);font-weight:600;letter-spacing:.4px;margin-top:1px;}

/* ══ DURACIÓN (texto flexible desde SharedPreferences) ══════ */
.dur-row{display:flex;align-items:center;justify-content:space-between;background:rgba(14,165,233,.05);border:1px solid rgba(14,165,233,.2);border-radius:11px;padding:10px 14px;margin-bottom:14px;}
.dur-lbl{font-size:.75rem;color:var(--mut2);font-weight:600;}
.dur-val{font-family:'Orbitron',sans-serif;font-size:.82rem;font-weight:900;color:var(--blue2);letter-spacing:.5px;}

/* ══ CAPTCHA ZONE — reCAPTCHA integrado ══════════════════════ */
.cap-zone{border:1px solid rgba(14,165,233,.18);border-radius:12px;min-height:68px;display:flex;align-items:center;justify-content:center;background:rgba(14,165,233,.03);margin-bottom:14px;padding:10px;overflow:hidden;}
.cap-tag{font-size:.58rem;color:rgba(14,165,233,.4);font-family:'Orbitron',sans-serif;letter-spacing:.5px;}

/* ══ ERROR ══════════════════════════════════════════════════ */
.err-box{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.22);border-radius:11px;padding:11px 13px;text-align:center;font-size:.78rem;color:var(--red);font-weight:600;margin-bottom:12px;display:none;line-height:1.45;}

/* ══ BOTÓN GENERAR ══════════════════════════════════════════ */
.btn-gen{width:100%;padding:14px;border:none;border-radius:12px;font-family:'Orbitron',sans-serif;font-size:.78rem;font-weight:900;letter-spacing:.6px;cursor:pointer;text-transform:uppercase;transition:all .3s;background:linear-gradient(135deg,#92400e,var(--gold),#fde68a);color:#1c1001;box-shadow:0 4px 20px rgba(245,158,11,.4);}
.btn-gen:disabled{opacity:.28;cursor:not-allowed;box-shadow:none;}
.btn-gen.loading{opacity:.6;cursor:not-allowed;animation:pb 1s ease-in-out infinite;}
@keyframes pb{0%,100%{opacity:.6;}50%{opacity:.35;}}
.btn-gen:not(:disabled):not(.loading):active{transform:scale(.96);}

/* ══ PANTALLA 2 — KEY ═══════════════════════════════════════ */
.gen-title{text-align:center;font-family:'Orbitron',sans-serif;font-size:.85rem;font-weight:900;color:var(--gold);letter-spacing:1px;margin-bottom:4px;}
.gen-sub{text-align:center;font-size:.72rem;color:var(--mut2);margin-bottom:18px;}
.key-box{background:rgba(0,0,0,.6);border:2px solid var(--gold);border-radius:14px;padding:18px 14px;margin-bottom:14px;text-align:center;box-shadow:0 0 20px var(--gd) inset,0 0 20px var(--gd);position:relative;overflow:hidden;}
.key-label{font-size:.62rem;color:var(--mut2);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.key-value{font-family:'Orbitron',sans-serif;font-size:1.05rem;font-weight:900;color:var(--gold2);letter-spacing:2px;word-break:break-all;text-shadow:0 0 14px var(--gd);min-height:1.4em;}
.key-shine{position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(245,158,11,.12),transparent);animation:shine 2.5s ease-in-out infinite;}
@keyframes shine{0%{left:-100%;}100%{left:150%;}}
.btn-copy{width:100%;padding:12px;border:1.5px solid rgba(245,158,11,.35);border-radius:11px;background:rgba(245,158,11,.08);color:var(--gold);font-family:'Rajdhani',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:.4px;cursor:pointer;text-transform:uppercase;transition:all .2s;margin-bottom:10px;}
.btn-copy:active{background:rgba(245,158,11,.2);}
.btn-copy.copied{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.08);}
.ip-box{background:rgba(34,197,94,.05);border:1px solid rgba(34,197,94,.18);border-radius:11px;padding:11px 13px;display:flex;align-items:flex-start;gap:10px;}
.ip-icon{font-size:1.1rem;flex-shrink:0;margin-top:1px;}
.ip-title{font-size:.78rem;font-weight:700;color:var(--green);margin-bottom:3px;}
.ip-detail{font-size:.72rem;color:var(--mut2);line-height:1.5;}
.ip-val{color:var(--txt);font-weight:600;}
</style>
</head>
<body>
<canvas id="cvs"></canvas>

<!-- ══ HEADER ═══════════════════════════════════════════════ -->
<div class="hbar">
  <button class="btn-back" id="btnBack">&#x2190; VOLVER</button>
  <div class="hcenter">
    <div class="htitle">EMPIRE TECH</div>
    <div class="hsub">KEY GENERATOR</div>
  </div>
  <div class="hbadge">&#x25CF; LIVE</div>
</div>

<!-- ══ SCREENS ═══════════════════════════════════════════════ -->
<div class="screens">

  <!-- S1: VERIFICACIÓN ─────────────────────────────────────── -->
  <div class="screen active" id="s1">
    <div class="card">

      <div class="srv-row">
        <div class="srv-ico">&#x1F451;</div>
        <div>
          <div class="srv-name">EMPIRE TECH</div>
          <div class="srv-s">Free Fire &bull; Keys Oficiales</div>
        </div>
        <div class="sdot"></div>
      </div>

      <!-- Stock real — se actualiza solo en vivo desde Firebase (escucharStockFirebase) -->
      <div class="stock-box">
        <div class="sl">
          <span>&#x1F525;</span>
          <span>Stock Disponible</span>
          <div class="ldot"></div>
        </div>
        <div class="stock-r">
          <div class="snum" id="snum">--</div>
          <div class="su">KEYS ACTIVAS</div>
        </div>
      </div>

      <!-- Duración — Java llama window.setDuracion("3h") o cualquier texto -->
      <div class="dur-row">
        <span class="dur-lbl">&#x23F1; Duraci&#xF3;n de tu key</span>
        <span class="dur-val" id="durVal">--</span>
      </div>

      <!-- CAPTCHA ZONE — Google reCAPTCHA -->
      <div class="cap-zone" id="capZone">
        <div class="g-recaptcha"
             data-sitekey="6LfjFmwtAAAAAO8f-AmldZMMk8Z_6VuujahQH_8s"
             data-theme="dark"
             data-callback="onCaptchaOk"
             data-expired-callback="onCaptchaExpirado"
             data-error-callback="onCaptchaError"></div>
      </div>

      <div class="err-box" id="errBox"></div>

      <button class="btn-gen" id="btnGen" disabled>&#x26A1; GENERAR KEY</button>
    </div>
  </div>

  <!-- S2: KEY GENERADA ─────────────────────────────────────── -->
  <div class="screen" id="s2">
    <div class="card">
      <div class="gen-title">&#x2714; KEY GENERADA</div>
      <div class="gen-sub">Copia tu key antes de salir</div>
      <div class="key-box">
        <div class="key-label">&#x1F511; TU KEY GRATUITA</div>
        <div class="key-value" id="keyVal">&#x2022;&#x2022;&#x2022;&#x2022;-&#x2022;&#x2022;&#x2022;&#x2022;-&#x2022;&#x2022;&#x2022;&#x2022;</div>
        <div class="key-shine"></div>
      </div>
      <button class="btn-copy" id="btnCopy">&#x274F; COPIAR KEY</button>
      <div class="ip-box">
        <span class="ip-icon">&#x1F6AB;</span>
        <div>
          <div class="ip-title">IP REGISTRADA</div>
          <div class="ip-detail">
            IP: <span class="ip-val" id="ipVal">---</span><br>
            Bloqueada por: <span class="ip-val" id="durLabel">--</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ── Partículas ───────────────────────────────────────────────────────────────
var cvs=document.getElementById('cvs'),cx=cvs.getContext('2d'),pts=[];
function rsz(){cvs.width=window.innerWidth;cvs.height=window.innerHeight;}
window.addEventListener('resize',rsz);rsz();
for(var i=0;i<38;i++){pts.push({x:Math.random()*cvs.width,y:Math.random()*cvs.height,vx:(Math.random()-.5)*.58,vy:(Math.random()-.5)*.58,r:Math.random()*1.3+.7});}
function draw(){
  cx.clearRect(0,0,cvs.width,cvs.height);
  for(var i=0;i<pts.length;i++){
    var p=pts[i];p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>cvs.width)p.vx*=-1;if(p.y<0||p.y>cvs.height)p.vy*=-1;
    cx.fillStyle='rgba(245,158,11,.6)';cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();
    for(var j=i+1;j<pts.length;j++){
      var q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<105){cx.strokeStyle='rgba(245,158,11,'+(0.14*(1-d/105))+')';cx.lineWidth=.5;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke();}
    }
  }
  requestAnimationFrame(draw);
}
draw();

// ── Firebase — proyecto "inyector-vip" ───────────────────────────────────────
var firebaseConfig={
  apiKey:"AIzaSyD2RER9tppFGlZUOPvexKB9Q9-7RjQWFv8",
  authDomain:"inyector-vip.firebaseapp.com",
  databaseURL:"https://inyector-vip-default-rtdb.firebaseio.com",
  projectId:"inyector-vip",
  storageBucket:"inyector-vip.firebasestorage.app",
  messagingSenderId:"369826938066",
  appId:"1:369826938066:android:644e255e94ec6300abc10b"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();

// ── Estado global ────────────────────────────────────────────────────────────
var duracion='';   // Texto exacto recibido desde Java (ej: "3h", "1h", "5h")
var refStockActual=null; // referencia activa al nodo de stock (para poder hacer .off())

// ── Escucha en vivo el stock de KEYS_WEB/KeysFree/{duracion} ─────────────────
// El stock = cantidad de hijos (keys) que tenga ese nodo. Se actualiza solo
// cada vez que cambia (por ejemplo cuando alguien genera una key y baja el stock).
function escucharStockFirebase(dur){
  if(refStockActual)refStockActual.off();
  refStockActual=db.ref('KEYS_WEB/KeysFree/'+dur);
  refStockActual.on('value',function(snap){
    window.setStock(snap.numChildren());
  });
}

// ── window.setStock(n) — Java la llama tras leer Firebase ────────────────────
window.setStock=function(n){
  var el=document.getElementById('snum');
  el.textContent=n;
  el.classList.add('update');
  setTimeout(function(){el.classList.remove('update');},700);
};

// ── window.setDuracion(texto) — Java la llama con el texto del SP ─────────────
// Acepta cualquier texto: "1h", "2h", "3h", "5h", etc.
// En cuanto llega el texto, se conecta EN VIVO al nodo de Firebase:
// KEYS_WEB/KeysFree/{duracion} y actualiza el stock automáticamente.
window.setDuracion=function(texto){
  duracion=texto;
  document.getElementById('durVal').textContent=texto;
  document.getElementById('durLabel').textContent=texto;
  escucharStockFirebase(texto);
};

// ── Señal a Java: página lista para recibir datos ────────────────────────────
// Java escucha onPageFinished y entonces llama setDuracion (esto ya conecta
// solo a Firebase y trae el stock en vivo, ver arriba)
document.addEventListener('DOMContentLoaded',function(){
  if(typeof Android!=='undefined'&&Android.onPaginaLista){
    Android.onPaginaLista();
  } else {
    // Simulación para pruebas fuera de la app: simula que Java ya envió
    // el texto de duración, para poder ver el flujo completo en navegador.
    // El stock que se ve acá SÍ es real, viene directo de Firebase.
    setTimeout(function(){window.setDuracion('1h');},400);
  }
});

// ── Captcha OK — Google reCAPTCHA llama esto al verificar ─────────────────────
window.onCaptchaOk=function(){
  document.getElementById('btnGen').disabled=false;
};

// ── Captcha expiró (pasó el tiempo y hay que verificar de nuevo) ─────────────
window.onCaptchaExpirado=function(){
  document.getElementById('btnGen').disabled=true;
};

// ── Captcha dio error (sin internet, sitekey mal, etc.) ───────────────────────
window.onCaptchaError=function(){
  document.getElementById('btnGen').disabled=true;
  errBox.textContent='Error cargando la verificación. Revisa tu conexión.';
  errBox.style.display='block';
};

// ── Transición pantallas ─────────────────────────────────────────────────────
function irA2(){
  var s1=document.getElementById('s1');
  s1.classList.add('exit');
  setTimeout(function(){s1.classList.remove('active','exit');document.getElementById('s2').classList.add('active');},380);
}

// ── Animación reveal de la key ───────────────────────────────────────────────
var pool='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function animarKey(keyFinal){
  var el=document.getElementById('keyVal'),step=0,total=20;
  var iv=setInterval(function(){
    var t='';
    var keyChars=keyFinal.replace(/-/g,'');
    var revealed=Math.floor((step/total)*keyChars.length);
    var ki=0;
    for(var i=0;i<keyFinal.length;i++){
      if(keyFinal[i]==='-'){t+='-';}
      else if(ki<revealed){t+=keyFinal[i];ki++;}
      else{t+=pool[Math.floor(Math.random()*pool.length)];ki++;}
    }
    el.textContent=t;
    step++;
    if(step>total){clearInterval(iv);el.textContent=keyFinal;}
  },60);
}

// ── Obtener IP pública ────────────────────────────────────────────────────────
function obtenerIP(cb){
  var x=new XMLHttpRequest();
  x.open('GET','https://api.ipify.org?format=json',true);
  x.timeout=6000;
  x.onload=function(){try{cb(JSON.parse(x.responseText).ip);}catch(e){cb('unknown');}};
  x.onerror=x.ontimeout=function(){cb('unknown');};
  x.send();
}

// ── Generar key directo desde Firebase ───────────────────────────────────────
// 1. Revisa si esa IP ya reclamó una key de esta duración (ip_bloqueadas)
// 2. Si no, hace una Transaction sobre KEYS_WEB/KeysFree/{duracion}:
//    elige una key AL AZAR entre los hijos y la borra ahí mismo (atómico,
//    así dos usuarios generando al mismo tiempo nunca se llevan la misma key)
// 3. Si todo salió bien, registra la IP como bloqueada para esa duración
function generarKeyFirebase(ip,dur,cb,errCb){
  var ipSaneada=ip.replace(/\./g,'_');
  var refBloqueo=db.ref('ip_bloqueadas/'+dur+'/'+ipSaneada);

  refBloqueo.once('value').then(function(snapBloqueo){
    if(snapBloqueo.exists()){
      errCb('Ya reclamaste una key de '+dur);
      return;
    }

    var refKeys=db.ref('KEYS_WEB/KeysFree/'+dur);
    var pickedKey=null;

    refKeys.transaction(function(current){
      pickedKey=null;
      if(!current)return current; // nodo vacío, no hay nada que hacer
      var ids=Object.keys(current);
      if(ids.length===0)return current;
      var idx=Math.floor(Math.random()*ids.length);
      var elegido=ids[idx];
      pickedKey=current[elegido];
      var actualizado={};
      for(var i=0;i<ids.length;i++){
        if(ids[i]!==elegido)actualizado[ids[i]]=current[ids[i]];
      }
      return actualizado;
    },function(error,committed){
      if(error){
        errCb('Error de conexión. Intenta de nuevo.');
        return;
      }
      if(!committed||!pickedKey){
        errCb('Sin stock disponible. Vuelve pronto.');
        return;
      }
      refBloqueo.set(firebase.database.ServerValue.TIMESTAMP);
      cb(pickedKey);
    });
  }).catch(function(){
    errCb('Error de conexión. Intenta de nuevo.');
  });
}

// ── Flujo GENERAR ────────────────────────────────────────────────────────────
var btnGen=document.getElementById('btnGen');
var errBox=document.getElementById('errBox');

btnGen.addEventListener('click',function(){
  if(btnGen.disabled||btnGen.classList.contains('loading'))return;
  errBox.style.display='none';
  btnGen.classList.add('loading');
  btnGen.textContent='Obteniendo IP...';

  obtenerIP(function(ip){
    document.getElementById('ipVal').textContent=ip;
    btnGen.textContent='Generando...';
    // Todo el flujo (chequeo de IP bloqueada, selección random de key,
    // transacción atómica y registro del bloqueo) pasa directo por Firebase,
    // ver la función generarKeyFirebase() arriba.
    generarKeyFirebase(ip,duracion,window.recibirKey,window.errorKey);
  });
});

// ── La key ya llegó (elegida y reservada directo en Firebase) ────────────────
window.recibirKey=function(key){
  btnGen.classList.remove('loading');
  btnGen.textContent='⚡ GENERAR KEY';
  irA2();
  setTimeout(function(){animarKey(key);},420);
  document.getElementById('btnCopy').setAttribute('data-key',key);
};

// ── Informa error (IP bloqueada, sin stock, error de conexión, etc.) ─────────
window.errorKey=function(msg){
  btnGen.classList.remove('loading');
  btnGen.disabled=false;
  btnGen.textContent='⚡ GENERAR KEY';
  errBox.textContent=msg||'Sin stock disponible. Vuelve pronto.';
  errBox.style.display='block';
};

// ── Copiar key ───────────────────────────────────────────────────────────────
// En la app: Android.copiarKey(key) usa el ClipboardManager nativo.
// Fuera de la app (navegador): usa la Clipboard API para poder probar igual.
document.getElementById('btnCopy').addEventListener('click',function(){
  var key=this.getAttribute('data-key')||'';
  if(typeof Android!=='undefined'&&Android.copiarKey){
    Android.copiarKey(key);
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(key).catch(function(){});
  }
  this.textContent='✔ COPIADO';
  this.classList.add('copied');
});

// ── Botón volver ─────────────────────────────────────────────────────────────
// En la app: Android.goBack() cierra el WebView / vuelve a la pantalla anterior.
// Fuera de la app (navegador): usa el history del navegador para poder probar.
document.getElementById('btnBack').addEventListener('click',function(){
  if(typeof Android!=='undefined'&&Android.goBack){
    Android.goBack();
  } else {
    console.log('[TEST] btnBack presionado — fuera de la app usaría history.back()');
    if(window.history.length>1)window.history.back();
  }
});
</script>
</body>
</html>
